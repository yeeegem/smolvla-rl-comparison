[project]
name = "smolvla-grasp-rl-compare"
version = "0.1.0"
description = "Flow-SDE PPO vs Guided Action Flow: two RL methods for fixing SmolVLA's grasp slip on the SO-ARM101."
# lerobot >= 0.5 needs >= 3.12. Nothing here needs Isaac, so 3.13 is fine and
# matches the venv the base checkpoint was trained in.
requires-python = ">=3.12,<3.14"
dependencies = [
    # Simulation
    "mujoco>=3.2.0",
    "gymnasium>=0.29.0",
    "mink>=0.0.5",              # differential-IK helper used by the scripted expert
    # Policy / dataset stack -- must match the checkpoint's training env
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # PINNED to a 0.6.x minor, not a floor. The Flow-SDE sampler reaches into
    # SmolVLA's KV cache to run the frozen VLM once per decision and then only
    # the action expert per denoise step; 0.5.x used a hand-rolled dict cache
    # with a `fill_kv_cache` flag and 0.6.x uses transformers' DynamicCache, so
    # the two are not interchangeable here. 0.6.x also dropped
    # lerobot.utils.control_utils, which is why grasprl/real/infer.py carries its
    # own small control loop rather than importing one.
    "lerobot[dataset,smolvla,feetech]>=0.6.0,<0.7.0",
    # IO / reporting
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",
    "av>=12.0.0",
    "imageio[ffmpeg]>=2.34.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grasprl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ISC004: the report builder assembles markdown as a list of implicitly
# concatenated string literals, which reads far better than explicit "+".
ignore = ["ISC004"]
